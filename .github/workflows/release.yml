name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.50.0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$version" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "version must look like v0.1.0 or v0.1.0-rc.1" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: go test ./...

      - name: Race test
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Protobuf lint
        run: buf lint

      - name: Shell lint
        run: shellcheck scripts/*.sh

      - name: Build packages
        run: VERSION="${{ steps.version.outputs.version }}" make release

      - name: Verify checksums
        working-directory: dist
        run: shasum -a 256 -c checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; uploading artifacts"
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes "Release artifacts for $VERSION."
          fi

          gh release upload "$VERSION" \
            dist/deployer-darwin-arm64.tar.gz \
            dist/deployer-linux-amd64.tar.gz \
            dist/deployer-linux-arm64.tar.gz \
            dist/checksums.txt \
            --clobber
