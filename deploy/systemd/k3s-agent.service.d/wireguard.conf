# Use only on workers whose k3s Flannel interface is wg0.
# Recreating wg0 invalidates Flannel's cached external interface. Restart k3s
# after the tunnel returns so Pod routes are rebuilt, not merely node heartbeats.
[Unit]
Requires=wg-quick@wg0.service
After=wg-quick@wg0.service
PartOf=wg-quick@wg0.service
