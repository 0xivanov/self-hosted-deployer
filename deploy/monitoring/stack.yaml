apiVersion: v1
kind: Namespace
metadata:
  name: deployer-monitoring
  labels:
    app.kubernetes.io/managed-by: deployer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: deployer-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer-prometheus
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: deployer-monitoring
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: deployer-monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployer-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: deployer-monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: deployer-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        cluster: self-hosted-deployer

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.deployer-monitoring.svc.cluster.local:9093

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - 127.0.0.1:9090

      - job_name: alertmanager
        static_configs:
          - targets:
              - alertmanager.deployer-monitoring.svc.cluster.local:9093

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.deployer-monitoring.svc.cluster.local:8080

      - job_name: loki
        static_configs:
          - targets:
              - loki.deployer-monitoring.svc.cluster.local:3100

      - job_name: alloy
        static_configs:
          - targets:
              - alloy.deployer-monitoring.svc.cluster.local:12345

      - job_name: grafana
        static_configs:
          - targets:
              - grafana.deployer-monitoring.svc.cluster.local:3000

      - job_name: deployer-apps
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - deployer-apps
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__meta_kubernetes_pod_phase]
            action: keep
            regex: Running
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: metrics
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: node
          - source_labels: [__meta_kubernetes_pod_node_name]
            action: replace
            target_label: instance
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: replace
            target_label: app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: deployer-monitoring
data:
  deployer-apps.yml: |
    groups:
      - name: deployer-apps
        rules:
          - alert: DeployerNodeUnavailable
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Host {{ $labels.node }} is unavailable"
              description: "Kubernetes has reported host {{ $labels.node }} as not ready for two minutes."

          - alert: DeployerAppTargetDown
            expr: up{job="deployer-apps"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} metrics target is down on {{ $labels.node }}"
              description: "Prometheus cannot scrape pod {{ $labels.pod }} on {{ $labels.node }}."

          - alert: DeployerAppNotReady
            expr: money_manager_ready{job="deployer-apps"} == 0
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} is not ready on {{ $labels.node }}"
              description: "Pod {{ $labels.pod }} on {{ $labels.node }} has failed its most recent dependency readiness check."

          - alert: DeployerDeploymentDegraded
            expr: |
              kube_deployment_status_replicas_available{namespace="deployer-apps"} > 0
              and on (namespace, deployment)
              kube_deployment_status_replicas_available{namespace="deployer-apps"}
                < on (namespace, deployment)
              kube_deployment_spec_replicas{namespace="deployer-apps"}
            for: 5m
            labels:
              severity: warning
              app: "{{ $labels.deployment }}"
            annotations:
              summary: "{{ $labels.deployment }} is running with fewer replicas"
              description: "The service still has a healthy replica, but available replicas have remained below the desired count for five minutes."

          - alert: DeployerServiceUnavailable
            expr: |
              kube_deployment_status_replicas_available{namespace="deployer-apps"} == 0
              and on (namespace, deployment)
              kube_deployment_spec_replicas{namespace="deployer-apps"} > 0
            for: 2m
            labels:
              severity: critical
              app: "{{ $labels.deployment }}"
            annotations:
              summary: "{{ $labels.deployment }} is completely unavailable"
              description: "No replicas of {{ $labels.deployment }} have been available for two minutes."

          - alert: DeployerAppHighErrorRate
            expr: |
              (
                sum by (app) (rate(money_manager_http_requests_total{job="deployer-apps",status_class="5xx"}[5m]))
                /
                sum by (app) (rate(money_manager_http_requests_total{job="deployer-apps"}[5m]))
              ) > 0.05
              and
              sum by (app) (increase(money_manager_http_requests_total{job="deployer-apps"}[5m])) >= 20
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "{{ $labels.app }} has a high server error rate"
              description: "More than 5% of at least 20 requests were 5xx responses for five minutes."

          - alert: DeployerAppHighLatency
            expr: |
              histogram_quantile(
                0.99,
                sum by (app, le) (rate(money_manager_http_request_duration_seconds_bucket{job="deployer-apps"}[5m]))
              ) > 2
              and
              sum by (app) (increase(money_manager_http_request_duration_seconds_count{job="deployer-apps"}[5m])) >= 20
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} has high request latency"
              description: "P99 API latency has exceeded two seconds for ten minutes."

          - alert: DeployerMaintenanceWorkerFailing
            expr: |
              sum by (app, worker, node, pod) (
                increase(money_manager_maintenance_runs_total{job="deployer-apps",result="error"}[15m])
              ) >= 3
              unless on (app, node, pod)
              min_over_time(up{job="deployer-apps"}[15m]) == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} worker {{ $labels.worker }} is failing on {{ $labels.node }}"
              description: "The maintenance worker in pod {{ $labels.pod }} on {{ $labels.node }} failed at least three times in fifteen minutes."

          - alert: DeployerScheduledMaintenanceStale
            expr: time() - money_manager_maintenance_last_success_timestamp_seconds{job="deployer-apps",worker="scheduled_transactions"} > 300
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} scheduled transaction worker is stale on {{ $labels.node }}"
              description: "No successful scheduled transaction maintenance run has completed on {{ $labels.node }} for five minutes."

          - alert: DeployerNotificationDeliveryStale
            expr: time() - money_manager_maintenance_last_success_timestamp_seconds{job="deployer-apps",worker="notification_delivery"} > 300
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} notification worker is stale on {{ $labels.node }}"
              description: "No successful notification delivery run has completed on {{ $labels.node }} for five minutes."

          - alert: DeployerOpenBankingSyncStale
            expr: time() - money_manager_maintenance_last_success_timestamp_seconds{job="deployer-apps",worker="open_banking_sync"} > 1200
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "{{ $labels.app }} open banking worker is stale on {{ $labels.node }}"
              description: "No successful open banking sync maintenance run has completed on {{ $labels.node }} for twenty minutes."

          - alert: DeployerContainerRestarting
            expr: |
              (
                sum by (namespace, pod, container) (
                  increase(kube_pod_container_status_restarts_total{namespace="deployer-apps"}[15m])
                ) >= 3
              )
              * on (namespace, pod) group_left (node)
              max by (namespace, pod, node) (kube_pod_info{namespace="deployer-apps"})
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.container }} is restarting on {{ $labels.node }}"
              description: "Pod {{ $labels.pod }} on {{ $labels.node }} restarted at least three times in fifteen minutes."

      - name: deployer-monitoring
        rules:
          - alert: DeployerMonitoringTargetDown
            expr: up{job=~"prometheus|alertmanager|kube-state-metrics|loki|alloy|grafana"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Monitoring target {{ $labels.job }} is down"
              description: "Prometheus cannot scrape a component of the monitoring stack."

          - alert: DeployerPrometheusRuleEvaluationFailing
            expr: increase(prometheus_rule_evaluation_failures_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus rule evaluation is failing"
              description: "At least one alerting rule evaluation failed in the last five minutes."

          - alert: DeployerAlertDeliveryFailing
            expr: increase(alertmanager_notifications_failed_total[10m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager cannot deliver notifications"
              description: "At least one notification delivery failed in the last ten minutes."
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
  namespace: deployer-monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: deployer-monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/managed-by: deployer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/managed-by: deployer
    spec:
      serviceAccountName: prometheus
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.13.0@sha256:c6b27ea434f8389bfe233fbc7be381cf50587c286e871bc842008f5a1b1908a7
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=15d
            - --storage.tsdb.retention.size=4GB
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: rules
              mountPath: /etc/prometheus/rules
              readOnly: true
            - name: data
              mountPath: /prometheus
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: rules
          configMap:
            name: prometheus-rules
        - name: data
          persistentVolumeClaim:
            claimName: prometheus-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: deployer-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
  namespace: deployer-monitoring
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: deployer-monitoring
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/managed-by: deployer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
        app.kubernetes.io/managed-by: deployer
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.32.1@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --enable-feature=utf8-strict-mode
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: alertmanager-config
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: deployer-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: deployer-monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/managed-by: deployer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/managed-by: deployer
    spec:
      serviceAccountName: kube-state-metrics
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.19.1@sha256:85108987d044b18a098126732f98602df408888c0f7d456241f5abefb9744bc1
          args:
            - --namespaces=deployer-apps
            - --resources=pods,deployments,nodes
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: deployer-monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
