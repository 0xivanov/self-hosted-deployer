syntax = "proto3";
package deployer.v1;
option go_package = "github.com/0xivanov/self-hosted-deployer/internal/proto/deployer/v1;deployerv1";

// Operator-only, write-only credential management. Rotation creates a new
// immutable revision; retained releases continue using the original revision.
service RegistryCredentialService {
  rpc CreateRegistryCredential(CreateRegistryCredentialRequest) returns (CreateRegistryCredentialResponse);
  rpc ListRegistryCredentials(ListRegistryCredentialsRequest) returns (ListRegistryCredentialsResponse);
}
message CreateRegistryCredentialRequest {
  string app_name = 1;
  string revision = 2;
  string registry = 3;
  string username = 4;
  string password = 5;
}
message RegistryCredentialMetadata {
  string app_name = 1;
  string revision = 2;
  string registry = 3;
  string created_at = 4;
}
message CreateRegistryCredentialResponse { RegistryCredentialMetadata credential = 1; }
message ListRegistryCredentialsRequest { string app_name = 1; }
message ListRegistryCredentialsResponse { repeated RegistryCredentialMetadata credentials = 1; }
