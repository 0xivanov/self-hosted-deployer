syntax = "proto3";

package deployer.v1;

option go_package = "github.com/0xivanov/self-hosted-deployer/internal/proto/deployer/v1;deployerv1";

service NodeService {
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  rpc JoinNode(JoinNodeRequest) returns (JoinNodeResponse);
  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse);
  rpc GetNode(GetNodeRequest) returns (GetNodeResponse);
  rpc HeartbeatNode(HeartbeatNodeRequest) returns (HeartbeatNodeResponse);
  rpc GetWorkerBootstrap(GetWorkerBootstrapRequest) returns (GetWorkerBootstrapResponse);
  rpc DrainNode(DrainNodeRequest) returns (DrainNodeResponse);
  rpc UncordonNode(UncordonNodeRequest) returns (UncordonNodeResponse);
  rpc RemoveNode(RemoveNodeRequest) returns (RemoveNodeResponse);
}

message Node {
  string id = 1;
  string name = 2;
  string status = 3;
  map<string, string> labels = 4;
  string created_at = 5;
  string updated_at = 6;
  string last_seen_at = 7;
  string hostname = 8;
  string arch = 9;
  string os = 10;
  string kernel = 11;
  string wireguard_ip = 12;
  string wireguard_public_key = 13;
  string kubernetes_status = 14;
  string kubernetes_message = 15;
  bool schedulable = 16;
  string vpn_status = 17;
}

message CreateJoinTokenRequest {
  string node_name = 1;
  map<string, string> labels = 2;
  int64 ttl_seconds = 3;
}

message CreateJoinTokenResponse {
  string join_token = 1;
  string expires_at = 2;
  string node_name = 3;
}

message JoinNodeRequest {
  string join_token = 1;
  string hostname = 2;
  string arch = 3;
  string public_key = 4;
}

message JoinNodeResponse {
  string node_id = 1;
  string agent_token = 2;
  string node_name = 3;
  string wireguard_ip = 4;
}

message ListNodesRequest {
  int32 page_size = 1;
  string page_token = 2;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  string next_page_token = 2;
}

message GetNodeRequest {
  string node_ref = 1;
}

message GetNodeResponse {
  Node node = 1;
}

message HeartbeatNodeRequest {
  string status = 1;
  string hostname = 2;
  string arch = 3;
  string os = 4;
  string kernel = 5;
  string resource_summary = 6;
  string vpn_status = 7;
}

message HeartbeatNodeResponse {
  string accepted_at = 1;
}

message GetWorkerBootstrapRequest {}

message GetWorkerBootstrapResponse {
  string node_name = 1;
  string wireguard_ip = 2;
  string wireguard_subnet = 3;
  string wireguard_hub_ip = 4;
  string wireguard_hub_public_key = 5;
  string wireguard_endpoint = 6;
  string k3s_url = 7;
  string k3s_token = 8;
}

message DrainNodeRequest {
  string node_ref = 1;
}

message DrainNodeResponse {
  Node node = 1;
}

message UncordonNodeRequest {
  string node_ref = 1;
}

message UncordonNodeResponse {
  Node node = 1;
}

message RemoveNodeRequest {
  string node_ref = 1;
}

message RemoveNodeResponse {
  Node node = 1;
}
